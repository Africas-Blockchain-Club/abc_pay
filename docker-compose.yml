services:
  postgres:
    image: postgres:17-alpine
    container_name: abc_pay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abc_pay
      POSTGRES_PASSWORD: abc_pay
      POSTGRES_DB: abc_pay
    ports:
      - "5432:5432"
    volumes:
      - abc_pay_postgres_data:/var/lib/postgresql/data

volumes:
  abc_pay_postgres_data:
